<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b0a67">
<title>BGJHS Day Clock</title>
<style>
:root{--p:#3b0a67;--p2:#53108d;--g:#f3bd21;--bg:#f7f5f8;--ink:#24152f;--muted:#6c6372;--card:#fff;--line:#e3dce8;--green:#e7f0df;--green-line:#a8c493;--lav:#eee4f7;--lav-line:#c4a8da;--blue:#e1eef9;--blue-line:#a8c8e8;--gold:#fbedc7;--gold-line:#e6c264;--pink:#fae2ea;--pink-line:#e4b3c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));min-height:100vh;overflow-x:hidden}.app{max-width:980px;margin:auto;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}h1{margin:0;color:var(--p);font-size:clamp(1.5rem,4vw,2.25rem);letter-spacing:-.03em}.sub{color:var(--muted);font-weight:700;font-size:.88rem;margin-top:4px}.now{text-align:right;color:var(--p);font-weight:900;font-variant-numeric:tabular-nums}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#ebe5ee;padding:6px;border-radius:16px;margin-bottom:18px}.tab{border:0;background:transparent;padding:12px;border-radius:12px;font:inherit;font-weight:900;color:var(--p);cursor:pointer}.tab.active{background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(59,10,103,.2)}.view{display:none;min-width:0}.view.active{display:block}.hero{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;border-radius:26px;padding:clamp(24px,5vw,40px);box-shadow:0 12px 30px rgba(42,16,61,.1)}.grade{color:#f9da77;font-weight:900;text-transform:uppercase;letter-spacing:.11em;font-size:.76rem}.period{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:950;margin:6px 0 0;letter-spacing:-.035em}.range{color:#e6ddec;font-weight:750;margin-top:6px}.count{text-align:center;font-size:clamp(4.3rem,17vw,9.4rem);font-weight:950;letter-spacing:-.07em;margin:30px 0 8px;font-variant-numeric:tabular-nums;line-height:.9}.label{text-align:center;color:#f7d466;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.bar{height:13px;background:#ffffff33;border-radius:99px;overflow:hidden;margin-top:26px}.fill{height:100%;background:var(--g);width:0;transition:width .5s linear}.footer{display:flex;justify-content:space-between;color:#e6ddec;font-weight:700;font-size:.82rem;margin-top:11px}.leave{margin-top:14px;background:var(--card);border:2px solid var(--g);border-radius:21px;padding:19px 20px;display:flex;justify-content:space-between;gap:18px;align-items:center;box-shadow:0 7px 20px rgba(55,28,72,.05)}.leave.now{background:#fff4c9}.small{color:var(--muted);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.leave-title{color:var(--p);font-weight:950;font-size:clamp(1.1rem,3vw,1.45rem);margin-top:4px}.leave-at{color:var(--muted);font-weight:750;font-size:.88rem;margin-top:4px}.leave-count{color:var(--p);font-size:clamp(2.35rem,7vw,4.25rem);font-weight:950;white-space:nowrap;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(55,28,72,.04)}.big{color:var(--p);font-size:1.25rem;font-weight:950;margin-top:6px}.lunch,.ann{display:none;margin-top:14px;background:#fff4c9;border:2px solid var(--g);border-radius:18px;padding:17px 18px}.lunch.show,.ann.show{display:block}.lunch h3,.ann h3{margin:0 0 9px;color:var(--p);font-size:1rem}.row{padding:4px 0;font-weight:800}.past{opacity:.42;text-decoration:line-through}.next{background:rgba(243,189,33,.27);margin:0 -6px;padding:6px;border-radius:9px}.route-head{margin-bottom:13px}.route-title{color:var(--p);font-size:clamp(1.5rem,4vw,2rem);font-weight:950;margin:0}.route-now{display:none;margin-bottom:14px;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:18px}.route-now.show{display:block}.route-now .small{color:#f7d466}.route-now-title{font-size:1.35rem;font-weight:950;margin-top:4px}.route-now-sub{color:#eadff0;font-weight:750;margin-top:5px}.route-board{display:grid;gap:14px;min-width:0}.route-lane{border:2px solid var(--lane-line);border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(55,28,72,.04);transition:.2s;min-width:0;max-width:100%}.route-lane.current{box-shadow:0 10px 26px rgba(55,28,72,.13);outline:3px solid rgba(243,189,33,.45)}.route-lane.done{opacity:.55}.route-lane-inner{display:grid;grid-template-columns:118px minmax(0,1fr);min-width:0;max-width:100%}.route-side{background:var(--lane-bg);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px 10px;text-align:center;min-width:0}.route-period-label{color:#15306f;font-size:1.1rem;font-weight:950}.route-icon{font-size:1.9rem;margin-top:8px}.route-content{min-width:0;max-width:100%;overflow:hidden}.route-main{width:100%;max-width:100%;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#c5b6cf #f1edf3}.route-main::-webkit-scrollbar{height:7px}.route-main::-webkit-scrollbar-track{background:#f1edf3;border-radius:99px}.route-main::-webkit-scrollbar-thumb{background:#c5b6cf;border-radius:99px}.path-step{flex:0 0 128px;scroll-snap-align:start;background:#fff;border:1px solid #ece6f0;border-radius:16px;padding:11px 9px;text-align:center;box-shadow:0 2px 8px rgba(55,28,72,.045)}.path-place{color:#152a66;font-weight:950;font-size:.9rem;line-height:1.08;text-transform:uppercase}.path-badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin:9px auto 7px;font-size:1.1rem;color:#fff}.badge-pickup{background:#8cb86d}.badge-drop{background:#ee9b00}.badge-stay{background:#b783cf}.badge-leave{background:#69a9d5}.path-action{font-weight:900;font-size:.74rem;line-height:1.15}.path-action.pickup{color:#4f942d}.path-action.drop{color:#bd7100}.path-action.stay{color:#9853bd}.path-action.leave{color:#2d82bd}.path-detail{margin-top:3px;font-weight:800;font-size:.8rem;line-height:1.16;color:#202020}.side-note{margin-top:4px;color:#555;font-size:.72rem;font-weight:700;line-height:1.15}.connector{flex:0 0 auto;color:#173a83;font-size:1.7rem;font-weight:950}.route-meta{padding:0 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.route-chip{display:inline-flex;background:#fff4c9;border:1px solid var(--g);border-radius:999px;color:var(--p);font-size:.78rem;font-weight:900;padding:6px 9px}.swipe-hint{display:none;color:var(--muted);font-size:.76rem;font-weight:900}.footnote{text-align:center;color:#8a8190;font-size:.7rem;font-weight:650;margin-top:14px}@media(max-width:700px){body{padding-left:12px;padding-right:12px}.cards{grid-template-columns:1fr}.leave{align-items:flex-start;flex-direction:column}.now{font-size:.9rem}.leave-count{font-size:3rem}.route-lane-inner{grid-template-columns:82px minmax(0,1fr)}.route-side{padding:12px 6px}.route-period-label{font-size:.92rem}.route-icon{font-size:1.5rem}.route-main{padding:11px 9px 12px;gap:8px;scroll-padding-left:9px}.path-step{flex:0 0 112px;padding:9px 7px}.path-place{font-size:.79rem}.connector{font-size:1.35rem}.route-meta{padding:0 9px 10px}.swipe-hint{display:inline-flex}.route-chip{font-size:.74rem;padding:5px 8px}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>BGJHS Day Clock</h1><div class="sub">2026–2027 bell schedule + pickup route</div></div><div class="now"><div id="clock">--:--:--</div><div id="date" class="sub"></div></div></header>
<nav class="tabs"><button class="tab active" data-view="clockView">Day Clock</button><button class="tab" data-view="routeView">My Route</button></nav>
<section id="clockView" class="view active"><section id="main"></section><div id="lunch" class="lunch"></div><div id="ann" class="ann"></div><div class="footnote">Pickup countdown is set to 8 minutes before the end of periods 1–6.</div></section>
<section id="routeView" class="view"><div class="route-head"><h2 class="route-title">Student Route</h2><div class="sub">Swipe each row left or right to see every stop.</div></div><div id="routeNow" class="route-now"></div><div id="routeBoard" class="route-board"></div></section>
</main>
<script>
const LEAVE=8;
const schedule=[{name:'WIN AM',start:'07:30',end:'07:40',pickup:false},{name:'1st Period',start:'07:43',end:'08:33',pickup:true},{name:'2nd Period',start:'08:36',end:'09:26',pickup:true},{name:'3rd Period',start:'09:29',end:'10:19',pickup:true},{name:'4th Period',start:'10:22',end:'11:12',pickup:true},{name:'5th Period',start:'11:15',end:'12:45',pickup:true,note:'Lunch block'},{name:'6th Period',start:'12:48',end:'13:38',pickup:true},{name:'WIN PM',start:'13:43',end:'14:20',pickup:false}];
const lunches=[['11:15','1st Lunch'],['11:41','2nd Lunch'],['12:07','3rd Lunch']];
const dismissals=[['14:20','6th Grade Hall'],['14:23','7th Grade Hall'],['14:25','8th Grade Hall'],['14:30','Car riders, clubs, athletic bus, athletic practice, homework help']];
const routes=[
{from:1,to:2,end:'08:33',icon:'🎒',bg:'var(--green)',line:'var(--green-line)',steps:[{place:'Pasham',type:'pickup',action:'Pick up',detail:'Ari + Marion'},{place:'Mr. Brown',type:'drop',action:'Drop off',detail:'Marion'},{place:'Powers',type:'drop',action:'Drop off',detail:'Ari'},{place:'Webb',type:'stay',action:'I go / stay',detail:''}]},
{from:2,to:3,end:'09:26',icon:'✏️',bg:'var(--lav)',line:'var(--lav-line)',steps:[{place:'Powers',type:'pickup',action:'Pick up',detail:'Ari'},{place:'Art',type:'drop',action:'Drop off',detail:'Ari'}]},
{from:3,to:4,end:'10:19',icon:'🎨',bg:'var(--blue)',line:'var(--blue-line)',steps:[{place:'Art',type:'pickup',action:'Pick up',detail:'Ari'},{place:'McSween',type:'drop',action:'Drop off',detail:'Ari'},{place:'Mr. Blake',type:'stay',action:'I go / stay',detail:''}]},
{from:4,to:5,end:'11:12',icon:'📓',bg:'var(--gold)',line:'var(--gold-line)',steps:[{place:'McSween',type:'leave',action:'Pick up',detail:'Ari + Ethan'},{place:'Hayes',type:'drop',action:'Drop off',detail:'Ethan'},{place:'Howard',type:'drop',action:'Drop off',detail:'Ari',note:'Marion is also here'},{place:'Howard',type:'stay',action:'I stay',detail:'(Howard)'}]},
{from:5,to:6,end:'12:45',icon:'📚',bg:'var(--pink)',line:'var(--pink-line)',steps:[{place:'Howard',type:'leave',action:'Leave with',detail:'Ari + Marion'},{place:'Patterson',type:'drop',action:'Drop off',detail:'Marion'},{place:'Hayes',type:'pickup',action:'Pick up',detail:'Ethan'},{place:'Ms. Quinn',type:'stay',action:'Drop off',detail:'Ari + Ethan',note:'I stay (Ms. Quinn)'}]}
];
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};const sec=(n,t)=>{const[a,b]=t.split(':').map(Number),d=new Date(n);d.setHours(a,b,0,0);return d/1000};const fmt=t=>{const[a,b]=t.split(':').map(Number),s=a>=12?'PM':'AM',h=((a+11)%12)+1;return `${h}:${String(b).padStart(2,'0')} ${s}`};const rem=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function leaveTime(end){const total=mins(end)-LEAVE,h=Math.floor(total/60),m=total%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function getState(n){const c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(c<mins(schedule[0].start))return{type:'before',name:'Before School',range:`WIN AM begins at ${fmt(schedule[0].start)}`,count:sec(n,schedule[0].start)-n/1000,label:'until WIN AM',start:null,end:schedule[0].start,progress:0,next:schedule[0],pickup:false};for(let i=0;i<schedule.length;i++){const x=schedule[i],a=mins(x.start),b=mins(x.end);if(c>=a&&c<b){const s=sec(n,x.start),e=sec(n,x.end),nn=n/1000;return{type:'class',...x,range:`${fmt(x.start)} – ${fmt(x.end)}${x.note?' • '+x.note:''}`,count:e-nn,label:'remaining',progress:(nn-s)/(e-s)*100,next:schedule[i+1]||null}}const nx=schedule[i+1];if(nx&&c>=b&&c<mins(nx.start)){const s=sec(n,x.end),e=sec(n,nx.start),nn=n/1000;return{type:'passing',name:'Passing Period',range:`${fmt(x.end)} – ${fmt(nx.start)}`,count:e-nn,label:`until ${nx.name.toLowerCase()}`,start:x.end,end:nx.start,progress:(nn-s)/(e-s)*100,next:nx,pickup:false}}}return{type:'after',name:'Regular Schedule Complete',range:'Dismissal sequence is in progress',count:0,label:'regular classes complete',start:null,end:null,progress:100,next:null,pickup:false}}
function leave(st,n){if(st.type==='passing')return{title:'You should already be moving',at:'',count:'ON ROUTE',now:true};if(st.type!=='class'||!st.pickup)return{title:st.name==='WIN AM'||st.name==='WIN PM'?'No pickup countdown during WIN':'Pickup clock not active',at:'',count:'—',now:false};const target=sec(n,st.end)-LEAVE*60,r=target-n/1000,d=new Date(target*1000);return{title:r<=0?'Leave to get kids':'Leave to get kids in',at:`Leave at ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`,count:r<=0?'LEAVE NOW':rem(r),now:r<=0}}
function renderLunch(n,st){const box=document.getElementById('lunch');if(st.name!=='5th Period'){box.classList.remove('show');box.innerHTML='';return}const c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;let next=lunches.findIndex(x=>c<mins(x[0]));box.classList.add('show');box.innerHTML='<h3>5th Period Lunch Times</h3>'+lunches.map((x,i)=>`<div class="row ${c>=mins(x[0])?'past':i===next?'next':''}"><strong>${fmt(x[0])}</strong> — ${x[1]}</div>`).join('')}
function renderDismissal(n){const box=document.getElementById('ann'),c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(c<mins('13:43')){box.classList.remove('show');box.innerHTML='';return}let next=dismissals.findIndex(x=>c<mins(x[0]));box.classList.add('show');box.innerHTML='<h3>Dismissal</h3>'+dismissals.map((x,i)=>`<div class="row ${c>=mins(x[0])?'past':i===next?'next':''}"><strong>${fmt(x[0])}</strong> — ${x[1]}</div>`).join('')}
function currentRouteIndex(n){const c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;for(let i=0;i<routes.length;i++){const start=mins(schedule[routes[i].from].start),nextStart=mins(schedule[routes[i].to].start);if(c>=start&&c<nextStart)return i}return -1}
function badgeSymbol(type){return type==='pickup'?'👤':type==='drop'?'📍':type==='stay'?'⭐':'👥'}
function renderRoute(n){const board=document.getElementById('routeBoard'),c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,idx=currentRouteIndex(n);board.innerHTML=routes.map((route,i)=>{const done=c>=mins(schedule[route.to].start)&&i!==idx,lt=leaveTime(route.end),steps=route.steps.map((step,j)=>`<div class="path-step"><div class="path-place">${step.place}</div><div class="path-badge badge-${step.type}">${badgeSymbol(step.type)}</div><div class="path-action ${step.type}">${step.action}</div><div class="path-detail">${step.detail||' '}</div>${step.note?`<div class="side-note">${step.note}</div>`:''}</div>${j<route.steps.length-1?'<div class="connector">→</div>':''}`).join('');return `<article class="route-lane ${i===idx?'current':''} ${done?'done':''}" style="--lane-bg:${route.bg};--lane-line:${route.line}"><div class="route-lane-inner"><div class="route-side"><div class="route-period-label">${route.from} ~ ${route.to}</div><div class="route-icon">${route.icon}</div></div><div class="route-content"><div class="route-main">${steps}</div><div class="route-meta"><span class="route-chip">Leave ${fmt(lt)}</span><span class="swipe-hint">Swipe stops ↔</span></div></div></div></article>`}).join('');const box=document.getElementById('routeNow');if(idx>=0){const r=routes[idx],lt=leaveTime(r.end),seconds=sec(n,lt)-n/1000;box.classList.add('show');box.innerHTML=`<div class="small">Current route</div><div class="route-now-title">${r.from} ~ ${r.to}</div><div class="route-now-sub">${seconds>0?`Leave in ${rem(seconds)} • ${fmt(lt)}`:'Leave now / route in progress'}</div>`}else{box.classList.remove('show');box.innerHTML=''}}
function renderClock(){const n=new Date,st=getState(n),lv=leave(st,n),next=st.next?`${st.next.name} • ${fmt(st.next.start)}`:'Dismissal';document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});document.getElementById('date').textContent=n.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});document.getElementById('main').innerHTML=`<div class="hero"><div class="grade">All Grades</div><div class="period">${st.name}</div><div class="range">${st.range}</div><div class="count">${rem(st.count)}</div><div class="label">${st.label}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,st.progress))}%"></div></div><div class="footer"><span>${st.start?'Start '+fmt(st.start):'—'}</span><span>${st.end?'End '+fmt(st.end):'—'}</span></div></div><div class="leave ${lv.now?'now':''}"><div><div class="small">Pickup clock</div><div class="leave-title">${lv.title}</div><div class="leave-at">${lv.at||'Leave time —'}</div></div><div class="leave-count">${lv.count}</div></div><div class="cards"><div class="card"><div class="small">Up next</div><div class="big">${next}</div></div><div class="card"><div class="small">Status</div><div class="big">${st.type==='class'?'Block in progress':st.type==='passing'?'Passing time':st.type==='after'?'Dismissal':'Waiting to start'}</div></div></div>`;renderLunch(n,st);renderDismissal(n);renderRoute(n)}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===btn.dataset.view));localStorage.setItem('bgjhs-tab',btn.dataset.view)}));const saved=localStorage.getItem('bgjhs-tab');if(saved)document.querySelector(`.tab[data-view="${saved}"]`)?.click();renderClock();setInterval(renderClock,250);
</script>
</body>
</html>
