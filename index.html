<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3b0a67"><title>BGJHS Day Clock</title><style>:root{--p:#3b0a67;--g:#f3bd21;--bg:#f7f5f8;--ink:#24152f;--muted:#6c6372}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}.app{max-width:980px;margin:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{margin:0;color:var(--p)}.now{text-align:right;font-weight:800;color:var(--p)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#ebe5ee;padding:6px;border-radius:16px;margin:18px 0}.tab{border:0;background:transparent;padding:11px;border-radius:12px;font-weight:800;color:var(--p)}.tab.active{background:var(--p);color:white}.panel{display:none}.panel.active{display:block}.hero{background:linear-gradient(145deg,#3b0a67,#53108d);color:#fff;border-radius:24px;padding:28px}.grade{color:#f9da77;font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem}.period{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;margin:6px 0 0}.range{color:#e6ddec;font-weight:700}.count{text-align:center;font-size:clamp(4.2rem,16vw,9rem);font-weight:950;letter-spacing:-.07em;margin:28px 0 8px;font-variant-numeric:tabular-nums}.label{text-align:center;color:#f7d466;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.bar{height:12px;background:#ffffff33;border-radius:99px;overflow:hidden;margin-top:24px}.fill{height:100%;background:var(--g);width:0}.footer{display:flex;justify-content:space-between;color:#e6ddec;font-weight:700;font-size:.82rem;margin-top:10px}.leave{margin-top:14px;background:#fff;border:2px solid var(--g);border-radius:20px;padding:18px;display:flex;justify-content:space-between;gap:18px;align-items:center}.leave.now{background:#fff4c9}.leave-title{color:var(--p);font-weight:900;font-size:1.2rem}.leave-at{color:var(--muted);font-weight:700;font-size:.86rem;margin-top:4px}.leave-count{color:var(--p);font-size:clamp(2.2rem,7vw,4rem);font-weight:950;white-space:nowrap}.cards{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.card{background:#fff;border-radius:18px;padding:18px}.small{color:var(--muted);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.big{color:var(--p);font-size:1.25rem;font-weight:900;margin-top:6px}.sub{color:var(--muted);font-weight:700;font-size:.88rem;margin-top:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#fff;border-radius:20px;padding:18px}.mini h2{color:var(--p);margin:0}.mini .mc{font-size:clamp(3rem,9vw,5rem);font-weight:950;text-align:center;margin:24px 0 0;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.mini .ml{text-align:center;color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase}.mini-leave{margin-top:14px;background:#fff4c9;border:1px solid var(--g);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px}.ann{display:none;margin-top:14px;background:#fff4c9;border:2px solid var(--g);border-radius:18px;padding:16px}.ann.show{display:block}.annrow{padding:4px 0;font-weight:800}.past{opacity:.4;text-decoration:line-through}@media(max-width:700px){.cards,.split{grid-template-columns:1fr}.leave{align-items:flex-start;flex-direction:column}.now{font-size:.9rem}.tabs{font-size:.78rem}}</style></head><body><main class="app"><header><div><h1>BGJHS Day Clock</h1><div class="sub">Bell schedule + pickup clock</div></div><div class="now"><div id="clock">--:--:--</div><div id="date" class="sub"></div></div></header><nav class="tabs"><button class="tab active" data-v="sixth">6th Grade</button><button class="tab" data-v="upper">7th/8th</button><button class="tab" data-v="split">Split View</button></nav><section id="sixth" class="panel active"></section><section id="upper" class="panel"></section><section id="split" class="panel"><div class="split"><div id="miniSixth" class="mini"></div><div id="miniUpper" class="mini"></div></div><div id="splitAnn" class="ann"></div></section></main><script>const LEAVE=8;const schedules={sixth:[['Homeroom','07:30','07:43'],['1st Period','07:48','08:30'],['2nd Period','08:35','09:17'],['3rd Period','09:22','10:04'],['4th Period','10:09','10:55'],['5th Period','11:00','12:27'],['6th Period','12:30','13:40'],['Homeroom','13:45','14:25']],upper:[['Homeroom','07:30','07:45'],['1st Period','07:48','08:32'],['2nd Period','08:35','09:19'],['3rd Period','09:22','10:06'],['4th Period','10:09','10:57'],['5th Period','11:00','12:30'],['6th Period','12:30','13:42'],['Homeroom','13:45','14:25']]};const anns=[['14:00','6th grade — report to gym'],['14:10','6th grade — from gym'],['14:14','7th grade — hall'],['14:17','8th grade — hall'],['14:30','Car riders, club, athletic bus, athletic practice, homework help']];const mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};const sec=(n,t)=>{let[a,b]=t.split(':').map(Number),d=new Date(n);d.setHours(a,b,0,0);return d/1000};const fmt=t=>{let[a,b]=t.split(':').map(Number),s=a>=12?'PM':'AM',h=((a+11)%12)+1;return `${h}:${String(b).padStart(2,'0')} ${s}`};const rem=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};function state(sc,n){let c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(c<mins(sc[0][1]))return{type:'before',name:'Before School',range:`Homeroom begins at ${fmt(sc[0][1])}`,count:sec(n,sc[0][1])-n/1000,label:'until homeroom',start:null,end:sc[0][1],progress:0,next:sc[0]};for(let i=0;i<sc.length;i++){let x=sc[i],a=mins(x[1]),b=mins(x[2]);if(c>=a&&c<b){let s=sec(n,x[1]),e=sec(n,x[2]),nn=n/1000;return{type:'class',name:x[0],range:`${fmt(x[1])} – ${fmt(x[2])}`,count:e-nn,label:'remaining',start:x[1],end:x[2],progress:(nn-s)/(e-s)*100,next:sc[i+1]||null}}let nx=sc[i+1];if(nx&&c>=b&&c<mins(nx[1])){let s=sec(n,x[2]),e=sec(n,nx[1]),nn=n/1000;return{type:'passing',name:'Passing Period',range:`${fmt(x[2])} – ${fmt(nx[1])}`,count:e-nn,label:`until ${nx[0].toLowerCase()}`,start:x[2],end:nx[1],progress:(nn-s)/(e-s)*100,next:nx}}}return{type:'after',name:'School Day Complete',range:'Regular schedule complete',count:0,label:'done for the day',start:null,end:null,progress:100,next:null}}function leave(st,n){if(st.type==='passing')return{title:'You should already be moving',at:'',count:'ON ROUTE',now:true};if(st.type!=='class'||!st.end)return{title:'No pickup countdown',at:'',count:'—',now:false};let target=sec(n,st.end)-LEAVE*60,r=target-n/1000,d=new Date(target*1000);return{title:r<=0?'Leave to get kids':'Leave to get kids in',at:`Leave at ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`,count:r<=0?'LEAVE NOW':rem(r),now:r<=0}}function ann(n){let c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(c<mins('13:45'))return'';return `<h3 style="margin:0 0 8px;color:#3b0a67">Afternoon announcements</h3>`+anns.map(a=>`<div class="annrow ${c>=mins(a[0])?'past':''}"><strong>${fmt(a[0])}</strong> — ${a[1]}</div>`).join('')}function full(id,title,st,lv,n){let next=st.next?`${st.next[0]} • ${fmt(st.next[1])}`:'Regular day complete';document.getElementById(id).innerHTML=`<div class="hero"><div class="grade">${title}</div><div class="period">${st.name}</div><div class="range">${st.range}</div><div class="count">${rem(st.count)}</div><div class="label">${st.label}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,st.progress))}%"></div></div><div class="footer"><span>${st.start?'Start '+fmt(st.start):'—'}</span><span>${st.end?'End '+fmt(st.end):'—'}</span></div></div><div class="leave ${lv.now?'now':''}"><div><div class="small">Pickup clock</div><div class="leave-title">${lv.title}</div><div class="leave-at">${lv.at||'Leave time —'}</div></div><div class="leave-count">${lv.count}</div></div><div class="cards"><div class="card"><div class="small">Up next</div><div class="big">${next}</div></div><div class="card"><div class="small">Status</div><div class="big">${st.type==='class'?'Class in progress':st.type==='passing'?'Passing time':st.type==='after'?'Day complete':'Waiting to start'}</div></div></div><div class="ann ${n.getHours()*60+n.getMinutes()>=825?'show':''}">${ann(n)}</div>`}function mini(id,title,st,lv){let next=st.next?`${st.next[0]} • ${fmt(st.next[1])}`:'Day complete';document.getElementById(id).innerHTML=`<h2>${title}</h2><div class="big">${st.name}</div><div class="sub">${st.range}</div><div class="mc">${rem(st.count)}</div><div class="ml">${st.label}</div><div class="mini-leave"><div><div class="small">Leave to get kids</div><div class="sub">${lv.at||'—'}</div></div><div class="big">${lv.count}</div></div><div class="sub" style="margin-top:12px"><strong>Next:</strong> ${next}</div>`}function tick(){let n=new Date;clock.textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});date.textContent=n.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});let s=state(schedules.sixth,n),u=state(schedules.upper,n),sl=leave(s,n),ul=leave(u,n);full('sixth','6th Grade',s,sl,n);full('upper','7th/8th Grade',u,ul,n);mini('miniSixth','6th Grade',s,sl);mini('miniUpper','7th/8th Grade',u,ul);let a=ann(n);splitAnn.classList.toggle('show',!!a);splitAnn.innerHTML=a}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.v));localStorage.setItem('view',b.dataset.v)});let v=localStorage.getItem('view');if(v)document.querySelector(`.tab[data-v="${v}"]`)?.click();tick();setInterval(tick,250);</script></body></html>
