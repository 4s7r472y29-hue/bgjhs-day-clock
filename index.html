<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b0a67">
<title>BGJHS Day Clock</title>
<style>
:root{--p:#3b0a67;--p2:#53108d;--g:#f3bd21;--bg:#f7f5f8;--ink:#24152f;--muted:#6c6372;--card:#fff;--line:#e3dce8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));min-height:100vh}.app{max-width:920px;margin:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{margin:0;color:var(--p);font-size:clamp(1.5rem,4vw,2.25rem);letter-spacing:-.03em}.sub{color:var(--muted);font-weight:700;font-size:.88rem;margin-top:4px}.now{text-align:right;color:var(--p);font-weight:900;font-variant-numeric:tabular-nums}.hero{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;border-radius:26px;padding:clamp(24px,5vw,40px);box-shadow:0 12px 30px rgba(42,16,61,.1)}.grade{color:#f9da77;font-weight:900;text-transform:uppercase;letter-spacing:.11em;font-size:.76rem}.period{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:950;margin:6px 0 0;letter-spacing:-.035em}.range{color:#e6ddec;font-weight:750;margin-top:6px}.count{text-align:center;font-size:clamp(4.3rem,17vw,9.4rem);font-weight:950;letter-spacing:-.07em;margin:30px 0 8px;font-variant-numeric:tabular-nums;line-height:.9}.label{text-align:center;color:#f7d466;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.bar{height:13px;background:#ffffff33;border-radius:99px;overflow:hidden;margin-top:26px}.fill{height:100%;background:var(--g);width:0;transition:width .5s linear}.footer{display:flex;justify-content:space-between;color:#e6ddec;font-weight:700;font-size:.82rem;margin-top:11px}.leave{margin-top:14px;background:var(--card);border:2px solid var(--g);border-radius:21px;padding:19px 20px;display:flex;justify-content:space-between;gap:18px;align-items:center;box-shadow:0 7px 20px rgba(55,28,72,.05)}.leave.now{background:#fff4c9}.small{color:var(--muted);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.leave-title{color:var(--p);font-weight:950;font-size:clamp(1.1rem,3vw,1.45rem);margin-top:4px}.leave-at{color:var(--muted);font-weight:750;font-size:.88rem;margin-top:4px}.leave-count{color:var(--p);font-size:clamp(2.35rem,7vw,4.25rem);font-weight:950;white-space:nowrap;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(55,28,72,.04)}.big{color:var(--p);font-size:1.25rem;font-weight:950;margin-top:6px}.lunch,.ann{display:none;margin-top:14px;background:#fff4c9;border:2px solid var(--g);border-radius:18px;padding:17px 18px}.lunch.show,.ann.show{display:block}.lunch h3,.ann h3{margin:0 0 9px;color:var(--p);font-size:1rem}.row{padding:4px 0;font-weight:800}.past{opacity:.42;text-decoration:line-through}.next{background:rgba(243,189,33,.27);margin:0 -6px;padding:6px;border-radius:9px}.footnote{text-align:center;color:#8a8190;font-size:.7rem;font-weight:650;margin-top:14px}@media(max-width:700px){.cards{grid-template-columns:1fr}.leave{align-items:flex-start;flex-direction:column}.now{font-size:.9rem}.leave-count{font-size:3rem}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>BGJHS Day Clock</h1><div class="sub">2026–2027 universal bell schedule + pickup clock</div></div><div class="now"><div id="clock">--:--:--</div><div id="date" class="sub"></div></div></header>
<section id="main"></section>
<div id="lunch" class="lunch"></div>
<div id="ann" class="ann"></div>
<div class="footnote">Pickup countdown is set to 8 minutes before the end of periods 1–6.</div>
</main>
<script>
const LEAVE=8;
const schedule=[
 {name:'WIN AM',start:'07:30',end:'07:40',pickup:false},
 {name:'1st Period',start:'07:43',end:'08:33',pickup:true},
 {name:'2nd Period',start:'08:36',end:'09:26',pickup:true},
 {name:'3rd Period',start:'09:29',end:'10:19',pickup:true},
 {name:'4th Period',start:'10:22',end:'11:12',pickup:true},
 {name:'5th Period',start:'11:15',end:'12:45',pickup:true,note:'Lunch block'},
 {name:'6th Period',start:'12:48',end:'13:38',pickup:true},
 {name:'WIN PM',start:'13:43',end:'14:20',pickup:false}
];
const lunches=[['11:15','1st Lunch'],['11:41','2nd Lunch'],['12:07','3rd Lunch']];
const dismissals=[['14:20','6th Grade Hall'],['14:23','7th Grade Hall'],['14:25','8th Grade Hall'],['14:30','Car riders, clubs, athletic bus, athletic practice, homework help']];
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const sec=(n,t)=>{const[a,b]=t.split(':').map(Number),d=new Date(n);d.setHours(a,b,0,0);return d/1000};
const fmt=t=>{const[a,b]=t.split(':').map(Number),s=a>=12?'PM':'AM',h=((a+11)%12)+1;return `${h}:${String(b).padStart(2,'0')} ${s}`};
const rem=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function getState(n){const c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(c<mins(schedule[0].start))return{type:'before',name:'Before School',range:`WIN AM begins at ${fmt(schedule[0].start)}`,count:sec(n,schedule[0].start)-n/1000,label:'until WIN AM',start:null,end:schedule[0].start,progress:0,next:schedule[0],pickup:false};for(let i=0;i<schedule.length;i++){const x=schedule[i],a=mins(x.start),b=mins(x.end);if(c>=a&&c<b){const s=sec(n,x.start),e=sec(n,x.end),nn=n/1000;return{type:'class',...x,range:`${fmt(x.start)} – ${fmt(x.end)}${x.note?' • '+x.note:''}`,count:e-nn,label:'remaining',progress:(nn-s)/(e-s)*100,next:schedule[i+1]||null}}const nx=schedule[i+1];if(nx&&c>=b&&c<mins(nx.start)){const s=sec(n,x.end),e=sec(n,nx.start),nn=n/1000;return{type:'passing',name:'Passing Period',range:`${fmt(x.end)} – ${fmt(nx.start)}`,count:e-nn,label:`until ${nx.name.toLowerCase()}`,start:x.end,end:nx.start,progress:(nn-s)/(e-s)*100,next:nx,pickup:false}}}return{type:'after',name:'Regular Schedule Complete',range:'Dismissal sequence is in progress',count:0,label:'regular classes complete',start:null,end:null,progress:100,next:null,pickup:false}}
function leave(st,n){if(st.type==='passing')return{title:'You should already be moving',at:'',count:'ON ROUTE',now:true};if(st.type!=='class'||!st.pickup)return{title:st.name==='WIN AM'||st.name==='WIN PM'?'No pickup countdown during WIN':'Pickup clock not active',at:'',count:'—',now:false};const target=sec(n,st.end)-LEAVE*60,r=target-n/1000,d=new Date(target*1000);return{title:r<=0?'Leave to get kids':'Leave to get kids in',at:`Leave at ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`,count:r<=0?'LEAVE NOW':rem(r),now:r<=0}}
function renderLunch(n,st){const box=document.getElementById('lunch');if(st.name!=='5th Period'){box.classList.remove('show');box.innerHTML='';return}const c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;let next=lunches.findIndex(x=>c<mins(x[0]));box.classList.add('show');box.innerHTML='<h3>5th Period Lunch Times</h3>'+lunches.map((x,i)=>`<div class="row ${c>=mins(x[0])?'past':i===next?'next':''}"><strong>${fmt(x[0])}</strong> — ${x[1]}</div>`).join('')}
function renderDismissal(n){const box=document.getElementById('ann'),c=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;if(c<mins('13:43')){box.classList.remove('show');box.innerHTML='';return}let next=dismissals.findIndex(x=>c<mins(x[0]));box.classList.add('show');box.innerHTML='<h3>Dismissal</h3>'+dismissals.map((x,i)=>`<div class="row ${c>=mins(x[0])?'past':i===next?'next':''}"><strong>${fmt(x[0])}</strong> — ${x[1]}</div>`).join('')}
function render(){const n=new Date,st=getState(n),lv=leave(st,n),next=st.next?`${st.next.name} • ${fmt(st.next.start)}`:'Dismissal';document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});document.getElementById('date').textContent=n.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});document.getElementById('main').innerHTML=`<div class="hero"><div class="grade">All Grades</div><div class="period">${st.name}</div><div class="range">${st.range}</div><div class="count">${rem(st.count)}</div><div class="label">${st.label}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,st.progress))}%"></div></div><div class="footer"><span>${st.start?'Start '+fmt(st.start):'—'}</span><span>${st.end?'End '+fmt(st.end):'—'}</span></div></div><div class="leave ${lv.now?'now':''}"><div><div class="small">Pickup clock</div><div class="leave-title">${lv.title}</div><div class="leave-at">${lv.at||'Leave time —'}</div></div><div class="leave-count">${lv.count}</div></div><div class="cards"><div class="card"><div class="small">Up next</div><div class="big">${next}</div></div><div class="card"><div class="small">Status</div><div class="big">${st.type==='class'?'Block in progress':st.type==='passing'?'Passing time':st.type==='after'?'Dismissal':'Waiting to start'}</div></div></div>`;renderLunch(n,st);renderDismissal(n)}
render();setInterval(render,250);
</script>
</body>
</html>
